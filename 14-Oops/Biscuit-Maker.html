<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscuit Maker</title>
</head>
<body>
   <script>
    class Biscuitmaker {
    constructor(name, price) {
        this.name = name;
        this.price = price;
    }

    showDetails() {
        console.log(`${this.name} costs ${this.price}`);
    }
}

let parleg = new Biscuitmaker("ParleG", "5rs");
console.log(parleg);
parleg.showDetails();

let oreo = new Biscuitmaker("Oreo", "10rs");
console.log(oreo)
oreo.showDetails();
   </script>
</body>
</html>
