<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement mouseleave event handling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
}

#box {
    width: 280px;
    height: 280px;
    background: linear-gradient(135deg, #6d5dfc, #8e44ad);
    border-radius: 20px;
    color: white;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    padding: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
}

#box:hover {
    transform: translateY(-8px) scale(1.03);
}
        </style>
</head>
<body>
    <div id="box">Implement mouseleave event handling</div>

    
    <script src="script.js"></script>
</body>
</html>
